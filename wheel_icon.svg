<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer Prize Wheel Rim -->
  <circle cx="32" cy="34" r="23" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Wheel Spokes -->
  <g stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round">
    <line x1="32" y1="11" x2="32" y2="27"/>
    <line x1="32" y1="41" x2="32" y2="57"/>
    <line x1="9" y1="34" x2="25" y2="34"/>
    <line x1="39" y1="34" x2="55" y2="34"/>
    <line x1="15.7" y1="17.7" x2="27" y2="29"/>
    <line x1="37" y1="39" x2="48.3" y2="50.3"/>
    <line x1="48.3" y1="17.7" x2="37" y2="29"/>
    <line x1="27" y1="39" x2="15.7" y2="50.3"/>
  </g>
  <!-- Rim Studs -->
  <g fill="#FFFFFF">
    <circle cx="32" cy="11" r="2.2"/>
    <circle cx="55" cy="34" r="2.2"/>
    <circle cx="32" cy="57" r="2.2"/>
    <circle cx="9" cy="34" r="2.2"/>
  </g>
  <!-- Center Hub -->
  <circle cx="32" cy="34" r="6.5" fill="#FFFFFF"/>
  <!-- Top Pointer Triangle -->
  <polygon points="32,16 26,5 38,5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
