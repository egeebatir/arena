<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer 3D Coin Edge Gradient -->
    <linearGradient id="coinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="30%" stop-color="#F5B041"/>
      <stop offset="70%" stop-color="#D68910"/>
      <stop offset="100%" stop-color="#7E5109"/>
    </linearGradient>

    <!-- Coin Face Radial Gold Sheen -->
    <radialGradient id="coinFace" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="25%" stop-color="#FFDE59"/>
      <stop offset="60%" stop-color="#F39C12"/>
      <stop offset="90%" stop-color="#B76200"/>
      <stop offset="100%" stop-color="#783F04"/>
    </radialGradient>

    <!-- Beveled Inner Wall Gradient -->
    <linearGradient id="innerWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#783F04" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE885" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Embossed Gold Motif Gradient -->
    <linearGradient id="embossGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFE066"/>
      <stop offset="85%" stop-color="#D37E00"/>
      <stop offset="100%" stop-color="#6E3800"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 1. Outer Coin Base & Serrated Edge Shadow -->
  <circle cx="32" cy="33" r="29" fill="#5A2E00" filter="url(#shadow)"/>
  <circle cx="32" cy="32" r="29" fill="url(#coinRim)"/>

  <!-- 2. Coin Edge Ridges / Serrations (Milled Edge) -->
  <g stroke="#7E5109" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="3.5" x2="32" y2="5.5"/>
    <line x1="46" y1="7.2" x2="45" y2="9.2"/>
    <line x1="56.8" y1="18" x2="54.8" y2="19"/>
    <line x1="60.5" y1="32" x2="58.5" y2="32"/>
    <line x1="56.8" y1="46" x2="54.8" y2="45"/>
    <line x1="46" y1="56.8" x2="45" y2="54.8"/>
    <line x1="32" y1="60.5" x2="32" y2="58.5"/>
    <line x1="18" y1="56.8" x2="19" y2="54.8"/>
    <line x1="7.2" y1="46" x2="9.2" y2="45"/>
    <line x1="3.5" y1="32" x2="5.5" y2="32"/>
    <line x1="7.2" y1="18" x2="9.2" y2="19"/>
    <line x1="18" y1="7.2" x2="19" y2="9.2"/>
  </g>

  <!-- 3. Inner Stepped Rim & Face -->
  <circle cx="32" cy="32" r="26" fill="url(#coinFace)"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="url(#innerWall)" stroke-width="1.6"/>

  <!-- 4. Beaded Pearl Ring (Sikke Inci Dizisi) -->
  <g fill="#FFECA0" opacity="0.85">
    <circle cx="32" cy="10" r="1.1"/>
    <circle cx="38" cy="11" r="1.1"/>
    <circle cx="44" cy="13.5" r="1.1"/>
    <circle cx="49" cy="17.5" r="1.1"/>
    <circle cx="52.5" cy="22.5" r="1.1"/>
    <circle cx="54" cy="28.5" r="1.1"/>
    <circle cx="53.5" cy="35" r="1.1"/>
    <circle cx="51" cy="41" r="1.1"/>
    <circle cx="46.5" cy="46.5" r="1.1"/>
    <circle cx="41" cy="50.5" r="1.1"/>
    <circle cx="35" cy="53" r="1.1"/>
    <circle cx="29" cy="53" r="1.1"/>
    <circle cx="23" cy="50.5" r="1.1"/>
    <circle cx="17.5" cy="46.5" r="1.1"/>
    <circle cx="13" cy="41" r="1.1"/>
    <circle cx="10.5" cy="35" r="1.1"/>
    <circle cx="10" cy="28.5" r="1.1"/>
    <circle cx="11.5" cy="22.5" r="1.1"/>
    <circle cx="15" cy="17.5" r="1.1"/>
    <circle cx="20" cy="13.5" r="1.1"/>
    <circle cx="26" cy="11" r="1.1"/>
  </g>

  <!-- 5. Center Coin Emboss: Laurel Wreath & Imperial Star -->
  <g fill="url(#embossGold)" stroke="#6E3800" stroke-width="0.6">
    <!-- Left leaves -->
    <path d="M 21 38 C 19 35 18 30 20 25 C 21 28 23 33 24 36 Z"/>
    <path d="M 18 31 C 15 29 16 25 18 22 C 20 25 21 28 20 31 Z"/>
    <path d="M 20 23 C 18 20 20 17 23 15 C 24 18 23 21 21 23 Z"/>
    <path d="M 24 16 C 24 14 27 12 30 12 C 29 15 27 16 25 17 Z"/>

    <!-- Right leaves -->
    <path d="M 43 38 C 45 35 46 30 44 25 C 43 28 41 33 40 36 Z"/>
    <path d="M 46 31 C 49 29 48 25 46 22 C 44 25 43 28 44 31 Z"/>
    <path d="M 44 23 C 46 20 44 17 41 15 C 40 18 41 21 43 23 Z"/>
    <path d="M 40 16 C 40 14 37 12 34 12 C 35 15 37 16 39 17 Z"/>

    <!-- Center Star Crest with 3D Facets -->
    <polygon points="32,18 35,26 43,26 37,31 39,39 32,34 25,39 27,31 21,26 29,26"/>
  </g>

  <!-- Star Inner Highlight -->
  <polygon points="32,20 34,26 40,26 35,30 37,36 32,32 27,36 29,30 24,26 30,26" fill="#FFFBE6" opacity="0.65"/>
  <circle cx="32" cy="28" r="2.2" fill="#FFFFFF"/>

  <!-- 6. Ribbon Tie at Bottom -->
  <path d="M 28 43 C 30 41 34 41 36 43 L 38 48 L 34 46 L 32 49 L 30 46 L 26 48 Z" fill="url(#embossGold)" stroke="#6E3800" stroke-width="0.6"/>

  <!-- 7. Specular Top Edge Arc Gleam -->
  <path d="M 16 16 A 22 22 0 0 1 48 16" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/>
</svg>
